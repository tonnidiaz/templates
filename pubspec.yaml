environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  tu:
    path: /media/tonni/win/src/Mint/Documents/GitHub/flutter/tu/
  visibility_aware_state: ^1.0.5
